<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도서관 대출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff6c9; --card: #fff1d9; --field: #fffdf7; --ink: #1f1a16; --muted: #5a4a3a; --line: #f0d49a;
    --accent: #b45309; --accent-ink: #fff; --ok-bg: #e3f1e8; --ok: #1f6b3f; --fail-bg: #fbe4e1; --fail: #b3261e;
  }
  * { box-sizing: border-box; }
  body { font-family: "Gowun Dodum", sans-serif; font-size: 18px; font-weight: 400; max-width: 560px; margin: 0 auto; padding: 0 16px 40px; background: var(--bg); color: var(--ink); line-height: 1.5; }
  header { text-align: center; padding: 32px 0 12px; }
  .logo { font-size: 56px; line-height: 1; }
  h1 { font-size: 34px; margin: 4px 0 6px; letter-spacing: -0.5px; }
  #status { display: inline-block; font-size: 15px; padding: 4px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); margin: 0; }
  .hint { font-size: 15px; color: var(--muted); margin: 10px 0 0; }
  .books { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .books span { font-size: 14px; font-weight: 400; padding: 3px 9px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 16px 0; box-shadow: 0 2px 10px rgba(60, 40, 20, 0.06); }
  h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h2 .icon { font-size: 28px; line-height: 1; }
  label { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 8px; }
  input { font: inherit; font-size: 16px; color: var(--ink); background: var(--field); padding: 10px 12px; width: 100%; margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  button { font: inherit; font-size: 16px; font-weight: 400; width: 100%; margin-top: 14px; padding: 12px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; cursor: pointer; transition: transform .05s, opacity .15s; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: .45; cursor: wait; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .result { margin-top: 14px; font-size: 26px; font-weight: 400; text-align: center; padding: 12px; border-radius: 12px; }
  .ok { background: var(--ok-bg); color: var(--ok); }
  .fail { background: var(--fail-bg); color: var(--fail); border: 2px solid var(--fail); }
  #l_res p { margin: 14px 0 0; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px; text-align: center; border-bottom: 1px solid var(--line); }
  th { background: var(--bg); font-size: 15px; color: var(--muted); font-weight: 400; }
  tr:last-child td { border-bottom: 0; }
  @media (min-width: 760px) {
    body { max-width: 960px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; align-items: start; }
    .grid section { margin: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">🦉</div>
  <h1>도서관 대출 시스템</h1>
  <p id="status">시스템(solution.py) 불러오는 중... 잠시만 기다려 주세요.</p>
  <p class="hint">날짜는 도서관 문을 연 날부터 "며칠째"(1 이상 정수) · 대출 기간 14일</p>
  <div class="books"><span>B001</span><span>B002</span><span>B003</span><span>B004</span><span>B005</span></div>
</header>

<div class="grid">
<section>
  <h2><span class="icon">📖</span>대출</h2>
  <div class="row">
    <label>책 번호<input id="b_book" placeholder="예: B001"></label>
    <label>며칠째<input id="b_day" inputmode="decimal" placeholder="예: 1"></label>
  </div>
  <label>이름<input id="b_name" placeholder="예: 김민수"></label>
  <button onclick="doBorrow()" disabled>대출하기</button>
  <div id="b_res"></div>
</section>

<section>
  <h2><span class="icon">↩️</span>반납</h2>
  <div class="row">
    <label>책 번호<input id="r_book" placeholder="예: B001"></label>
    <label>며칠째<input id="r_day" inputmode="decimal" placeholder="예: 10"></label>
  </div>
  <label>이름<input id="r_name" placeholder="빌린 사람 이름"></label>
  <button onclick="doReturn()" disabled>반납하기</button>
  <div id="r_res"></div>
</section>
</div>

<section>
  <h2><span class="icon">📋</span>대출 목록</h2>
  <label>이름<input id="l_name" placeholder="예: 김민수"></label>
  <button onclick="doLoans()" disabled>대출 목록 보기</button>
  <div id="l_res"></div>
</section>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const val = id => document.getElementById(id).value;
let py;
(async () => {
  try {
    py = await loadPyodide();
    const code = await (await fetch("solution.py?" + Date.now())).text();
    py.FS.writeFile("solution.py", code);
    py.runPython(`
import solution
lib = solution.LibraryLoan()
def to_num(s):
    s = s.strip()
    try:
        return int(s)
    except ValueError:
        try:
            return float(s)
        except ValueError:
            return s
`);
    document.getElementById("status").textContent = "준비 완료";
    document.querySelectorAll("button").forEach(b => b.disabled = false);
  } catch (e) {
    document.getElementById("status").textContent = "불러오기 실패: " + e;
  }
})();

function call(expr, args) {
  for (const [k, v] of Object.entries(args)) py.globals.set(k, v);
  return py.runPython(expr);
}

function show(id, ok, text) {
  const el = document.getElementById(id);
  el.className = "result " + (ok ? "ok" : "fail");
  el.textContent = text;
}

function doBorrow() {
  const ok = call("lib.borrow(a_book.strip(), a_name, to_num(a_day)) is True",
    { a_book: val("b_book"), a_name: val("b_name"), a_day: val("b_day") });
  show("b_res", ok, ok ? "✅ 대출 성공" : "❌ 대출 실패");
}

function doReturn() {
  const r = call("lib.return_book(a_book.strip(), a_name, to_num(a_day))",
    { a_book: val("r_book"), a_name: val("r_name"), a_day: val("r_day") });
  if (r === -1) show("r_res", false, "❌ 반납 실패");
  else show("r_res", true, `✅ 반납 성공 · 연체 ${r}일`);
}

function doLoans() {
  const rows = call("[list(x) for x in lib.get_loans(a_name)]", { a_name: val("l_name") }).toJs();
  const esc = s => String(s).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
  const el = document.getElementById("l_res");
  const title = `<p><b>${esc(val("l_name"))}</b> 님의 대출 목록</p>`;
  if (rows.length === 0) { el.innerHTML = title + "<p>빌린 책 없음</p>"; return; }
  el.innerHTML = title + "<table><tr><th>책 번호</th><th>반납 기한</th></tr>" +
    rows.map(([b, due]) => `<tr><td>${esc(b)}</td><td>${due}일째까지</td></tr>`).join("") + "</table>";
}
</script>
</body>
</html>
